[misc]
# Keep this workstation's automatic updates to the safe, useful steps.
only = ["nix", "home_manager", "system", "git_repos"]
disable = ["node"] # "node" is npm: exclude claude, codex, pi, and -axi globals so unattended breaking updates cannot interrupt work in flight; remove this line deliberately later to enable them.

[git]
# Update only these user repositories, not Topgrade's predefined repository list.
pull_predefined = false
repos = [
  "/home/thanhbinh/firstmate",
  "/home/thanhbinh/data/Personal/**/*",
]
# Topgrade 17.9.0 uses git pull --ff-only --recurse-submodules here, never push or force-update.
fetch_only = false
